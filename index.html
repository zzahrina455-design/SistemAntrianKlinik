<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrean Ibnu Sina</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --green-soft:    #d4edda;
            --green-mid:     #a8d5b5;
            --green-deep:    #3a7d58;
            --green-accent:  #2e6b4a;
            --green-dark:    #1a4a30;
            --white:         #ffffff;
            --text-dark:     #1c3a28;
            --shadow:        rgba(30, 80, 50, 0.18);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 40%, #81c784 100%);
            overflow: hidden;
            position: relative;
        }

        /* ── Background hospital watermark ── */
        .bg-hospital {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 0;
        }

        .bg-hospital svg {
            width: min(85vw, 700px);
            opacity: 0.08;
            filter: blur(1px);
        }

        /* ── Decorative blobs ── */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            z-index: 0;
        }
        .blob-1 { width: 380px; height: 380px; background: #66bb6a; top: -80px; left: -80px; }
        .blob-2 { width: 300px; height: 300px; background: #43a047; bottom: -60px; right: -60px; }
        .blob-3 { width: 200px; height: 200px; background: #a5d6a7; bottom: 30%; left: 10%; }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1.5px solid rgba(255,255,255,0.6);
            border-radius: 28px;
            padding: 52px 48px 44px;
            max-width: 480px;
            width: 92%;
            box-shadow:
                0 8px 40px var(--shadow),
                0 2px 8px rgba(30,80,50,0.08),
                inset 0 1px 0 rgba(255,255,255,0.8);
            text-align: center;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(36px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Logo / icon ── */
        .logo-wrap {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, var(--green-deep), var(--green-accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            box-shadow: 0 6px 24px rgba(46, 107, 74, 0.35);
            animation: pulse 2.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 6px 24px rgba(46, 107, 74, 0.35); }
            50%       { box-shadow: 0 6px 32px rgba(46, 107, 74, 0.55); }
        }

        .logo-wrap svg { width: 40px; height: 40px; fill: #fff; }

        /* ── Typography ── */
        .welcome-label {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            font-size: 0.82rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--green-deep);
            margin-bottom: 4px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.2;
            margin-bottom: 6px;
        }

        h1 span { color: var(--green-deep); }

        .subtitle {
            font-size: 0.82rem;
            color: #5a7a65;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, #b2d8bc, transparent);
        }
        .divider span {
            font-size: 0.72rem;
            color: #7aaa8a;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ── Info text ── */
        .info-text {
            font-size: 0.83rem;
            color: #5a7a65;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* ── Buttons ── */
        .btn-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 36px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: none;
            outline: none;
            letter-spacing: 0.03em;
        }

        .btn-register {
            background: linear-gradient(135deg, var(--green-deep) 0%, var(--green-accent) 100%);
            color: #fff;
            box-shadow: 0 4px 18px rgba(46, 107, 74, 0.38);
        }

        .btn-register:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 28px rgba(46, 107, 74, 0.50);
        }

        .btn-login {
            background: transparent;
            color: var(--green-accent);
            border: 2px solid var(--green-mid);
        }

        .btn-login:hover {
            background: var(--green-mid);
            color: var(--green-dark);
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 6px 20px rgba(100, 180, 130, 0.3);
        }

        .btn svg { width: 17px; height: 17px; }

        /* ── Footer note ── */
        .footer-note {
            margin-top: 30px;
            font-size: 0.72rem;
            color: #8aaa95;
        }

        /* ── Floating cross decoration ── */
        .cross-deco {
            position: fixed;
            z-index: 1;
            opacity: 0.07;
            pointer-events: none;
        }
        .cross-deco.top-right { top: 8%; right: 6%; font-size: 5rem; color: var(--green-dark); }
        .cross-deco.bot-left  { bottom: 10%; left: 4%; font-size: 3.5rem; color: var(--green-dark); }

        /* ── Ripple effect on button click ── */
        .btn { position: relative; overflow: hidden; }
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-anim 0.55s linear;
            background: rgba(255,255,255,0.35);
            pointer-events: none;
        }
        @keyframes ripple-anim {
            to { transform: scale(4); opacity: 0; }
        }

        @media (max-width: 420px) {
            .card { padding: 38px 24px 32px; }
            h1 { font-size: 1.6rem; }
            .btn { padding: 12px 26px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="card">
        <!-- Logo -->
        <div class="logo-wrap">
            <svg viewBox="0 0 24 24">
                <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 14H9v-4H5v-2h4V7h3v4h4v2h-4v4z"/>
            </svg>
        </div>

        <p class="welcome-label">Selamat Datang Di</p>
        <h1>Sistem <span>Antrean</span><br>Ibnu Sina</h1>

        <div class="divider"><span>Mulai</span></div>

        <p class="info-text">
            Silahkan melakukan pendaftaran<br>untuk menggunakan layanan antrean online.
        </p>

        <div class="btn-group">
            <a href="register.php" class="btn btn-register" onclick="addRipple(event, this)">
                Register
            </a>
            <a href="login.php" class="btn btn-login" onclick="addRipple(event, this)">
                Login
            </a>
        </div>
    </div>

    <script>
        function addRipple(e, btn) {
            const circle = document.createElement('span');
            const rect   = btn.getBoundingClientRect();
            const size   = Math.max(rect.width, rect.height);
            circle.style.cssText = `
                width:${size}px; height:${size}px;
                left:${e.clientX - rect.left - size/2}px;
                top:${e.clientY - rect.top  - size/2}px;
            `;
            circle.classList.add('ripple');
            btn.appendChild(circle);
            circle.addEventListener('animationend', () => circle.remove());
        }
    </script>

</body>
</html>
